name: HouseFriends CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo-doctor
      - run: npx expo export --platform all --output-dir dist-all

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed production credentials
        run: |
          pattern='sb_''secret_[0-9A-Za-z_-]{20,}|BEGIN PRIVATE'' KEY|AI''za[0-9A-Za-z_-]{30,}'
          if git grep -nE "$pattern" -- ':!package-lock.json'; then
            echo 'Potential production credential detected.'
            exit 1
          fi
